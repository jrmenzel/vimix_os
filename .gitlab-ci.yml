stages:
  - build
  - usertests

default:
  image: pandora:5050/robert/vimixos/ci-ubuntu3:26.04
  tags: ["docker"]

variables:
  BUILD_PARAMS: '-j $(nproc) EXTERNAL_KERNEL_FLAGS=-D_SHUTDOWN_ON_PANIC'

.with_build_artifacts:
  artifacts:
    paths:
      - build/filesystem.img
      - build/boot/kernel-vimix
      - build/boot/kernel-vimix.bin
      - build_host/root/usr/bin/mkfs
      - build_host/root/usr/bin/fsck.vimixfs
    when: always
    expire_in: 1 week

.build_job:
  stage: build
  extends: .with_build_artifacts

.usertest_job:
  stage: usertests
  artifacts:
    paths:
      - build/logs/
    when: always
    expire_in: 1 week

#before_script:
#  - echo starting

# needs clang 20 or newer, so requires Ubuntu 25.04 or newer
clang_format_check:
  allow_failure: true
  stage: build
  script:
    - tools/tests/check_formatting.sh

# build with GCC analyzer on a recent Ubuntu
gcc_15_analyze_riscv:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS ANALYZE=1"

# Build all platforms on GCC 15
build_qemu32_deb:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=qemu32 BUILD_TYPE=debug"

build_qemu32_rel:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=qemu32 BUILD_TYPE=release"

build_qemu64_deb:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=qemu64 BUILD_TYPE=debug"

build_qemu64_rel:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=qemu64 BUILD_TYPE=release"

build_spike32_deb:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=spike32 BUILD_TYPE=debug"

build_spike32_rel:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=spike32 BUILD_TYPE=release"

build_spike64_deb:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=spike64 BUILD_TYPE=debug"

build_spike64_rel:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=spike64 BUILD_TYPE=release"

build_visionfive2_deb:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=visionfive2 BUILD_TYPE=debug"

build_visionfive2_rel:
  extends: .build_job
  script:
    - eval "make $BUILD_PARAMS PLATFORM=visionfive2 BUILD_TYPE=release"

# tests

usertests_release:
  extends: .usertest_job
  needs:
    - job: build_qemu64_rel
      artifacts: true
  script:
    - ./tools/tests/run_test.sh usertests.sh qemu64 "ALL TESTS PASSED"

