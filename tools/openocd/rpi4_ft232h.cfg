# Raspberry Pi 4B (BCM2711) JTAG over FT232H (MPSSE).
#
# Wiring assumes the default UM232H OpenOCD mapping:
# - FT232H AD0 (TCK) -> RPi GPIO25 (pin 22)
# - FT232H AD1 (TDI) -> RPi GPIO26 (pin 37)
# - FT232H AD2 (TDO) -> RPi GPIO24 (pin 18)
# - FT232H AD3 (TMS) -> RPi GPIO27 (pin 13)
# - FT232H ACBUS0 (nTRST, optional) -> RPi GPIO22 (pin 15)
# - GND -> any RPi GND pin (required)
#
# Keep all logic at 3.3V.

source [find interface/ftdi/um232h.cfg]
transport select jtag

# Robust default: do not rely on reset lines.
# If TRST is wired and verified, this can be changed to:
# reset_config trst_only
reset_config none

source [find target/bcm2711.cfg]

# Keep this aligned with VS Code launch configurations in this repo.
gdb_port 26000
telnet_port 27001
tcl_port 27002

# Normal default for stable wiring.
# If stable, you can increase further (e.g. 2000 or 4000).
adapter speed 1000

init
halt
